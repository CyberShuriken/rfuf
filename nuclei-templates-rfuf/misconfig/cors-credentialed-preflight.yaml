id: rfuf-cors-credentialed-preflight
info:
  name: RFUF — Credentialed CORS preflight allows cross-origin POST
  author: rfuf
  severity: high
  description: |
    The target's OPTIONS preflight response includes our Origin in
    `Access-Control-Allow-Origin` AND `Access-Control-Allow-Credentials: true`
    AND `Access-Control-Allow-Methods` contains a state-changing verb (POST/PUT/DELETE).
    This means an attacker-controlled origin can issue authenticated cross-origin
    requests with arbitrary HTTP methods.
  reference:
    - https://portswigger.net/web-security/cors
  tags: rfuf,cors,misconfig

http:
  - method: OPTIONS
    path:
      - "{{BaseURL}}"
    headers:
      Origin: https://attacker.example
      Access-Control-Request-Method: POST
      Access-Control-Request-Headers: content-type,authorization
    matchers-condition: and
    matchers:
      - type: word
        name: acao
        part: header
        words:
          - "https://attacker.example"
      - type: word
        name: acac
        part: header
        words:
          - "true"
        case-insensitive: true
      - type: word
        name: methods
        part: header
        words:
          - "POST"
          - "PUT"
          - "DELETE"
        condition: or
        case-insensitive: true
    extractors:
      - type: regex
        name: allow_methods
        part: header
        group: 1
        regex:
          - 'Access-Control-Allow-Methods:\s*([^\r\n]+)'